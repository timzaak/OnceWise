name: CWS Publish

# Manual escape hatch: cd.yml's store-upload job already submits the draft for
# review on every v*.*.* tag, so normal releases need no dispatch. Run this only
# to re-submit by hand (e.g. a rejection resolved with a re-uploaded draft).

on:
  workflow_dispatch:

jobs:
  publish:
    name: Submit store draft for review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish current draft
        working-directory: extension
        env:
          CWS_SA_JSON: ${{ secrets.CWS_SA_JSON }}
          # Public item ID, also pinned in skills/oncewise-message/protocol.mjs.
          CWS_ITEM_ID: dmmhmcdbkbbgbcidafhlhepdchjboenc
        run: node scripts/cws-publish.mjs
