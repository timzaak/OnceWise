name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    name: Detect Backend Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      previous_version: ${{ steps.changes.outputs.previous_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare backend against previous release
        id: changes
        env:
          REPO: ${{ github.repository }}
        run: |
          image="${REPO,,}"
          current="${GITHUB_REF_NAME}"
          # Newest vX.Y.Z tag strictly below the current one in version order.
          prev_tag=$(git tag -l 'v*.*.*' --sort=-v:refname | awk -v cur="$current" '$0 == cur {found = 1; next} found {print; exit}')

          if [ -z "$prev_tag" ]; then
            echo "No previous release tag found — building."
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$prev_tag" "$current" -- backend docker/Dockerfile; then
            echo "Backend changed since $prev_tag — building."
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          elif ! docker buildx imagetools inspect "${REGISTRY}/${image}:${prev_tag#v}" > /dev/null 2>&1; then
            echo "Backend unchanged since $prev_tag, but the previous image tag is gone from the registry — building."
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Backend unchanged since $prev_tag — skipping the build, aliasing image ${prev_tag#v} to ${current#v}."
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            echo "previous_version=${prev_tag#v}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.backend_changed == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: [detect, build]
    # Also runs when build was skipped (backend unchanged) — it then skips the
    # digest merge and only aliases the previous image to this version's tag.
    if: ${{ !cancelled() && needs.detect.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        if: needs.detect.outputs.backend_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        run: |
          image="${IMAGE_NAME,,}"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${image}" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${image#*/}" >> $GITHUB_ENV

      - name: Create manifest list and push
        if: needs.detect.outputs.backend_changed == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Re-tag previous image as this version
        if: needs.detect.outputs.backend_changed == 'false'
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.previous_version }}

      - name: Clean up GHCR intermediate versions
        if: needs.detect.outputs.backend_changed == 'true'
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ env.PACKAGE_NAME }}
          delete-tags: build-cache-*
          delete-untagged: true
          validate: true

  release:
    name: Create GitHub Release
    needs: merge
    # Check the direct need only: the default success() gate also requires the transitive
    # `build` job, which is skipped on the backend-unchanged path — that skip silenced
    # release creation for v1.1.2.
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  store-upload:
    name: Upload Chrome Web Store package
    needs: release
    # Activation switch: set the repo variable CWS_UPLOAD_ENABLED=true (Settings →
    # Secrets and variables → Actions → Variables) after configuring the CWS_SA_JSON /
    # CWS_PUBLISHER_ID secrets. vars (not secrets) gates the job because the secrets
    # context is not available in job-level `if`. !cancelled() guards against the same
    # transitive-skip that silenced the v1.1.2 release.
    if: ${{ !cancelled() && needs.release.result == 'success' && vars.CWS_UPLOAD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Build store package
        working-directory: extension
        run: |
          npm ci
          npm run build
          npm run zip:store

      - name: Resolve package path
        id: pkg
        working-directory: extension
        run: echo "zip=.output/oncewise-ai-$(jq -r .version .output/chrome-mv3/manifest.json)-chrome-store.zip" >> "$GITHUB_OUTPUT"

      # Token minting lives in the script (self-signed SA JWT exchange) — see its
      # header for why not google-github-actions/auth.
      - name: Upload package as new console draft
        working-directory: extension
        env:
          CWS_SA_JSON: ${{ secrets.CWS_SA_JSON }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          # Public item ID, also pinned in skills/oncewise-message/protocol.mjs.
          CWS_ITEM_ID: dmmhmcdbkbbgbcidafhlhepdchjboenc
          ZIP_PATH: ${{ steps.pkg.outputs.zip }}
        run: node scripts/cws-upload.mjs

      - name: Attach store zip to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "extension/${{ steps.pkg.outputs.zip }}" --clobber
