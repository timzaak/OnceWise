<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnceWise Flow</title>
    <!-- The prerendered "/" route is a client-side redirect, so the static
         build would 404 at the site root on GitHub Pages. Hop to the default
         locale instead (relative survives any base path). location.replace
         runs before first paint and keeps the stub out of history; the meta
         refresh covers no-JS, and the anchor is the last-resort fallback. -->
    <meta http-equiv="refresh" content="0; url=en/" />
    <script>
      location.replace("en/");
    </script>
  </head>
  <body>
    <a href="en/">OnceWise Flow documentation</a>
  </body>
</html>
